<body>
    <header>
        <a href="../index.html"> 
        <img src="../assets/img/logo.png.jpg" alt="Logo Fútbol Total" style="width: 150px; height: auto; display: block; margin: 0 auto;"> </a>
        <h1>Futbol Total</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="competiciones.html">Competiciones</a></li>
                <li><a href="equipos.html">Equipos</a></li>
                <li><a href="jugadores.html">Jugadores</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>Ponte en contacto con nosotros</h1>
            <h2>Querés sugerirnos un equipo para analizar?</h2>
            <h2>¿Tenés dudas sobre alguna estadística?</h2>
            <p> ¡Dejanos tu mensaje y sumate a nuestra comunidad futbolera!". </p>
        </section>
        <section>
            <h3>Formulario de contacto</h3>
            <form>
                <label for="nombre-cliente">Ingrese su nombre completo:</label>
                 <input id= "nombre-cliente" name="nombre-cliente" type="text" placeholder="Ej: Juan Pérez" required>
                 <label for="email-cliente">Ingrese su correo electrónico:</label>
                 <input id="email-cliente" name="email-cliente" type="email" placeholder="Ej: juan@perez.com" required>
                 <label for="telefono-contacto">Ingrese su número de teléfono:</label>
                 <input id="telefono-contacto" name="telefono-contacto" type="number" placeholder="Ej: 123456789" required>
                 <label for="mensaje-cliente">Ingrese su mensaje:</label>
                 <textarea name="mensaje-cliente" id="mensaje-cliente"required minlength="5"></textarea>
                 <button type="submit">Enviar</button>
            </form>
</main>
